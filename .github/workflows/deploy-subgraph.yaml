name: Deploy subgraph
on:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        network:
          - flare
          - arbitrum-one
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G

      - name: Generate abis
        run: ./prep-cyclo.sh
      
      - name: Generate subgraph code
        run: nix develop -c graph codegen
        working-directory: .

      - name: Build subgraph
        run: nix develop -c graph build --network ${{ matrix.network }}
        working-directory: .

      # Check if the repo is clean before deploying.
      # Exclude subgraph.yaml (updated by build) and address files (updated by script)
      - run: git diff --exit-code -- . ':!subgraph.yaml'

      # Name: cyclo-<network>
      # Version label: <yyyy>-<mm>-<dd>-<commit sha>
      - name: Deploy to Ormi
        env:
          ORMI_DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}
        run: >
          nix develop -c graph deploy "cyclo-${{ matrix.network }}"
          --version-label "$(date -u +%Y-%m-%d)-${GITHUB_SHA}"
          --node https://subgraph.api.ormilabs.com/deploy
          --ipfs https://subgraph.api.ormilabs.com/ipfs
          --deploy-key "$ORMI_DEPLOY_KEY"
        working-directory: .
